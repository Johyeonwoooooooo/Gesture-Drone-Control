[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lidar-imu-slam-pipeline"
version = "1.0.0"
description = "Real-time LiDAR-IMU SLAM and data post-processing pipeline for StrayScanner datasets"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "SLAM Pipeline Team"}
]
keywords = ["slam", "lidar", "imu", "3d-reconstruction", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "open3d>=0.15.0",
    "scipy>=1.7.0",
    "pillow>=8.0.0",
    "scikit-video>=1.1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[project.urls]
Homepage = "https://github.com/your-username/lidar-imu-slam-pipeline"
Repository = "https://github.com/your-username/lidar-imu-slam-pipeline"
Issues = "https://github.com/your-username/lidar-imu-slam-pipeline/issues"

[project.scripts]
lidar-imu-slam = "LiDAR_IMU_SLAM:main"
slam-postprocess = "post_processor:main"

[tool.setuptools]
py-modules = ["LiDAR_IMU_SLAM", "post_processor"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]